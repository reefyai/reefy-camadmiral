name: Stalled snapshot regression
on:
  push:
    branches: ["fix-snapshot-health", "fix-auth-retry"]
  workflow_dispatch:
    inputs:
      application_ref:
        description: Exact application commit for unchanged-baseline diagnostics
        type: string
        default: ""
      watchdog_only:
        description: Run only the focused stalled-video regression
        type: boolean
        default: false
  workflow_call:
    inputs:
      watchdog_only:
        type: boolean
        default: false
      github_hosted:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.head_ref && format('refs/heads/{0}', github.head_ref)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  stream-settings:
    if: ${{ !inputs.watchdog_only }}
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: mirror.gcr.io/library/ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 15
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git libstdc++6 lsb-release python3 python3-venv
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -r requirements.txt -r e2e/requirements.txt
      - run: python3 -m playwright install --with-deps webkit
      - run: python3 e2e/stream_layout_ui.py
      - run: python3 e2e/stream_settings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stream-settings-evidence
          path: e2e-artifacts/stream-settings/
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  auth-retry:
    if: ${{ !inputs.watchdog_only }}
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: mirror.gcr.io/library/ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 15
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git libstdc++6 lsb-release python3 python3-venv
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - run: python3 e2e/auth_retry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-retry-evidence
          path: e2e-artifacts/auth-retry/
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  snapshot-health:
    if: ${{ !inputs.watchdog_only }}
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: mirror.gcr.io/library/ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 15
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git libstdc++6 lsb-release python3 python3-venv
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - run: python3 e2e/snapshot_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-health-evidence
          path: e2e-artifacts/snapshot-health/
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  stalled-snapshot:
    if: ${{ !inputs.watchdog_only }}
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: mirror.gcr.io/library/ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 15
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git libstdc++6 lsb-release python3 python3-venv
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - run: python3 e2e/stalled_snapshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stalled-snapshot-evidence
          path: e2e-artifacts/stalled-snapshot/
      - name: Cleanup
        if: always()
        run: docker compose -p camadmiral-stalled-e2e -f e2e/compose.yaml -f e2e/stalled-snapshot-compose.yaml down --volumes --remove-orphans
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  stall-recovery:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, big-bird]
    container:
      image: mirror.gcr.io/library/ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_E2E_APPLICATION_REF: ${{ inputs.application_ref || '' }}
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 15
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git libstdc++6 lsb-release python3 python3-venv
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - name: Verify same-address stalled video recovery and recording preservation
        run: python3 e2e/stall_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-recovery-evidence
          path: e2e-artifacts/stall-recovery/
          if-no-files-found: error
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-stall-recovery
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore
