name: Measure go2rtc relay latency

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/relay-latency.yml
      - .github/actions/docker-lab/**
      - scripts/ci_docker.py
      - e2e/latency.py
      - e2e/scenarios.py
      - e2e/fixtures/latency-relay.yaml

permissions:
  contents: read

concurrency:
  group: camadmiral-relay-latency-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  benchmark:
    name: Matched-frame relay benchmark
    runs-on: [self-hosted, Linux, X64, big-bird]
    container:
      image: ghcr.io/reefyai/camadmiral-ci@sha256:52afc5d826d93d276ec0cc0d1a94763907ab72be9f4d8bffee2854306c337a59
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 10
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Verify prepared CI inputs
        run: python3 scripts/ci_tools.py
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab

      - name: Measure one additional go2rtc hop
        run: python3 e2e/latency.py

      - name: Remove benchmark resources
        if: always()
        run: >-
          docker compose --project-name camadmiral-latency --file e2e/compose.yaml
          down --volumes --remove-orphans
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore
