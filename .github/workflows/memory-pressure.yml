name: Media memory regression
on:
  workflow_dispatch:
    inputs:
      retention_only:
        description: Run only the offline-source retention regression
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: camadmiral-memory-regression
  cancel-in-progress: false
jobs:
  rtsp-retention:
    uses: ./.github/workflows/rtsp-retention.yml
  memory:
    if: ${{ !inputs.retention_only }}
    runs-on: [self-hosted, Linux, X64, big-bird]
    container:
      image: ghcr.io/reefyai/camadmiral-ci@sha256:b594314f18c7417ab93a25f58dcdf5a63c302ab63eedd8210beb4d0312453b67
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 15
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Verify prepared CI inputs
        run: python3 scripts/ci_tools.py
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - run: python3 e2e/memory_pressure.py
        env:
          CAMADMIRAL_MEMORY_CYCLES: "60"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-memory-evidence
          path: e2e-artifacts/memory-pressure/
      - name: Remove memory regression resources
        if: always()
        run: >-
          docker compose -p camadmiral-memory-e2e
          -f e2e/compose.yaml -f e2e/memory-compose.yaml
          down --volumes --remove-orphans
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore
