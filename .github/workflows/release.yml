name: Publish CamAdmiral

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-gate:
    name: Verify tested commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful release gate for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "release-gate.yml",
                status: "success",
                per_page: 100,
              },
            );
            const match = runs.find(run => run.head_sha === context.sha);
            if (!match) {
              core.setFailed(
                `Commit ${context.sha} has not passed the CamAdmiral release gate. ` +
                "Run the release gate for this exact commit before publishing.",
              );
              return;
            }
            core.info(`Reusing successful release gate run ${match.id} for ${context.sha}.`);

  publish:
    name: Publish amd64 image
    needs: verify-release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and release metadata
        id: release
        shell: bash
        run: |
          python3 scripts/validate-release.py
          VERSION=$(tr -d '\n' < VERSION)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/reefyai/reefy-camadmiral:${{ steps.release.outputs.version }}
            ghcr.io/reefyai/reefy-camadmiral:latest
          sbom: true
          provenance: mode=max
