name: Publish CamAdmiral

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  publish:
    name: Publish multi-architecture image
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and release metadata
        id: release
        shell: bash
        run: |
          python3 scripts/validate-release.py
          VERSION=$(tr -d '\n' < VERSION)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/reefyai/reefy-camadmiral:${{ steps.release.outputs.version }}
            ghcr.io/reefyai/reefy-camadmiral:latest
          sbom: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/reefyai/reefy-camadmiral
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
