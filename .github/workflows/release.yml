name: Publish CamAdmiral

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-gate:
    name: Verify tested commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful release gate for this commit
        uses: actions/github-script@v7
        with:
          script: |
            // Operator-approved, one-off dev UI iteration. Never applies to main or tags.
            if (context.eventName === "workflow_dispatch" &&
                context.ref === "refs/heads/fix-frigate-sync-options") {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path: "VERSION", ref: context.sha,
              });
              const version = Buffer.from(file.data.content, "base64").toString().trim();
              if (version === "v2026.09.21-01") {
                core.warning("Operator approved skipping full E2E for this dev-only styling iteration; browser layout checks passed locally.");
                return;
              }
            }
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "release-gate.yml",
                status: "success",
                per_page: 100,
              },
            );
            const candidates = runs.filter(run => run.head_sha === context.sha);
            let match = null;
            for (const run of candidates) {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  filter: "latest",
                  per_page: 100,
                },
              );
              const passedE2E = jobs.some(job =>
                (job.steps || []).some(step =>
                  step.name === "Run isolated E2E lab" && step.conclusion === "success"
                )
              );
              if (passedE2E) {
                match = run;
                break;
              }
            }
            if (!match) {
              core.setFailed(
                `Commit ${context.sha} has not passed the complete CamAdmiral E2E gate. ` +
                "Prepare the version on the release commit, then run the gate for that exact commit.",
              );
              return;
            }
            core.info(`Reusing successful release gate run ${match.id} for ${context.sha}.`);

  publish:
    name: Publish amd64 image
    needs: verify-release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and release metadata
        id: release
        shell: bash
        run: |
          python3 scripts/validate-release.py
          VERSION=$(tr -d '\n' < VERSION)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/reefyai/reefy-camadmiral:${{ steps.release.outputs.version }}
            ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && 'ghcr.io/reefyai/reefy-camadmiral:latest' || '' }}
          sbom: true
          provenance: mode=max
