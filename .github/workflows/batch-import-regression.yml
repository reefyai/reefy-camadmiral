name: Grouped Frigate import regression

on:
  workflow_call:
    inputs:
      github_hosted:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      github_hosted:
        description: Use GitHub-hosted Linux for the isolated labs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  regression:
    name: Grouped import / ${{ matrix.scenario }} / ${{ matrix.frigate }}
    strategy:
      fail-fast: false
      matrix:
        frigate: ["0.17.2", "0.18.2"]
        scenario: [batch, recovery]
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: ubuntu:24.04
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
      FRIGATE_TEST_VERSION: ${{ matrix.frigate }}
      FRIGATE_BATCH_CASE: ${{ matrix.scenario }}
    timeout-minutes: 30
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git libstdc++6 lsb-release python3 python3-venv
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - name: Verify grouped handoff and bounded reader recovery
        run: python3 e2e/frigate_batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-${{ matrix.scenario }}-${{ matrix.frigate }}
          path: e2e-artifacts/frigate-batch/
          if-no-files-found: error
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-batch-${{ matrix.scenario }}-${{ matrix.frigate }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore
