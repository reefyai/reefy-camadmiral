name: Build prepared CI tools
on:
  push:
    branches: [perf/prepared-ci-tools]
    paths:
      - ci/tools.Dockerfile
      - scripts/ci_bootstrap.sh
      - scripts/ci_packages.py
      - scripts/ci_tools.py
      - requirements.txt
      - e2e/requirements.txt
      - .github/workflows/ci-tools.yml
      - e2e/prepared_tools.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camadmiral-ci-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'reefyai/reefy-camadmiral' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, big-bird]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    container:
      image: mirror.gcr.io/library/ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
      CAMADMIRAL_CI_PACKAGE_COMMAND_SECONDS: "300"
      CAMADMIRAL_CI_PACKAGE_BUDGET_SECONDS: "2100"
    steps:
      - name: Bootstrap builder with bounded package acquisition
        shell: bash
        run: |
          mv /etc/apt/apt.conf.d/docker-clean /tmp/camadmiral-docker-clean
          #!/bin/bash
          # Minimal pre-checkout bootstrap; mirrored verbatim in the CI tools builder.
          set -euo pipefail
          bootstrap_ci() {
            local attempt status log
            log=$(mktemp)
            for attempt in 1 2 3 4 5 6; do
              status=0
              timeout 90 apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o APT::Update::Error-Mode=any update >"$log" 2>&1 || status=$?
              if [ "$status" = 0 ]; then
                timeout 180 apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 --download-only install -y --no-install-recommends ca-certificates curl git libstdc++6 lsb-release python3 python3-venv >>"$log" 2>&1 || status=$?
              fi
              cat "$log"
              if [ "$status" = 0 ]; then
                DEBIAN_FRONTEND=noninteractive apt-get --no-download install -y --no-install-recommends ca-certificates curl git libstdc++6 lsb-release python3 python3-venv
                rm -f "$log"
                return
              fi
              if [ "$attempt" = 6 ] || grep -Eiq 'certificate verification failed|not signed|NO_PUBKEY|invalid signature|401 Unauthorized|403 Forbidden|no space left|unable to locate package|does not have a Release file' "$log"; then
                rm -f "$log"
                return "$status"
              fi
              if [ "$status" != 124 ] && ! grep -Eiq 'bad record mac|decryption failed|unexpected EOF|connection|temporary failure|failed to fetch|hash sum mismatch|file has unexpected size' "$log"; then
                rm -f "$log"
                return "$status"
              fi
              printf 'CI bootstrap acquisition retry %s/6\n' "$attempt"
              sleep "$((5 * attempt))"
            done
          }
          bootstrap_ci
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Test package acquisition failure boundaries
        run: |
          python3 -m unittest discover -s tests -p test_ci_bootstrap.py -v
          python3 -m unittest discover -s tests -p test_ci_packages.py -v
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
          cache: pip
      - name: Install exact Python dependencies
        run: python -m pip install -r requirements.txt -r e2e/requirements.txt
      - name: Assemble source-only tool image context
        shell: bash
        run: |
          context="$RUNNER_TEMP/ci-tools-context"
          mkdir -p "$context/scripts" "$context/e2e" "$context/apt-cache"
          cp ci/tools.Dockerfile "$context/Dockerfile"
          cp scripts/ci_bootstrap.sh scripts/ci_packages.py scripts/ci_tools.py "$context/scripts/"
          cp requirements.txt "$context/"
          cp e2e/requirements.txt "$context/e2e/"
          cp -a /opt/camadmiral-toolcache/Python "$context/python-cache"
          cp /var/cache/apt/archives/*.deb "$context/apt-cache/"
      - name: Build prepared image in the private daemon
        run: docker build --tag camadmiral-ci:qualification --build-arg TOOLS_REVISION="$GITHUB_SHA" "$RUNNER_TEMP/ci-tools-context"
      - name: Verify installed tools and real browser
        run: |
          mkdir -p e2e-artifacts/ci-tools
          docker run --rm --entrypoint /bin/bash --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace camadmiral-ci:qualification -c 'export LD_LIBRARY_PATH=/opt/camadmiral-toolcache/Python/3.13.18/x64/lib; /opt/camadmiral-toolcache/Python/3.13.18/x64/bin/python e2e/prepared_tools.py' > e2e-artifacts/ci-tools/smoke.json
          cat e2e-artifacts/ci-tools/smoke.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified CI image
        run: |
          image="ghcr.io/reefyai/camadmiral-ci:sha-$GITHUB_SHA"
          docker tag camadmiral-ci:qualification "$image"
          docker push "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' > e2e-artifacts/ci-tools/repo-digests.json
      - name: Retain prepared image for review
        run: docker save camadmiral-ci:qualification | gzip -1 > e2e-artifacts/ci-tools/prepared-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-ci-image
          path: e2e-artifacts/ci-tools/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-tools-private-docker
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore
