name: CamAdmiral release gate

on:
  workflow_call:
    inputs:
      force_full:
        description: Run the complete release gate regardless of changed paths
        type: boolean
        default: true
  pull_request:
  workflow_dispatch:
    inputs:
      github_hosted:
        description: Use GitHub-hosted Linux when the self-hosted runner is unavailable
        type: boolean
        default: false
      force_full:
        description: Run the complete release gate regardless of changed paths
        type: boolean
        default: true
      batch_only:
        description: Run only the parallel grouped-import regressions for baseline diagnosis
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: camadmiral-release-gate-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  batch-import:
    name: Grouped takeover and reader recovery
    needs: classify-changes
    if: inputs.batch_only || needs.classify-changes.outputs.e2e == 'true'
    uses: ./.github/workflows/batch-import-regression.yml
    with:
      github_hosted: ${{ inputs.github_hosted || false }}

  restart-recovery:
    name: Slow restart recovery / ${{ matrix.frigate }}
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        frigate: ["0.17.2", "0.18.2"]
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: ghcr.io/reefyai/camadmiral-ci@sha256:b594314f18c7417ab93a25f58dcdf5a63c302ab63eedd8210beb4d0312453b67
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
      FRIGATE_TEST_VERSION: ${{ matrix.frigate }}
    timeout-minutes: 30
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify prepared CI inputs
        run: python3 scripts/ci_tools.py
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - name: Verify slow handoff and interrupted restoration
        run: python3 e2e/frigate_restart_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restart-recovery-${{ matrix.frigate }}
          path: e2e-artifacts/frigate-restart-recovery/
          if-no-files-found: error
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-restart-recovery-${{ matrix.frigate }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  direct-auth-import:
    name: Direct authenticated import / ${{ matrix.frigate }}
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        frigate: ["0.17.2", "0.18.2"]
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: ghcr.io/reefyai/camadmiral-ci@sha256:b594314f18c7417ab93a25f58dcdf5a63c302ab63eedd8210beb4d0312453b67
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
      FRIGATE_TEST_VERSION: ${{ matrix.frigate }}
    timeout-minutes: 20
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify prepared CI inputs
        run: python3 scripts/ci_tools.py
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - name: Verify authenticated direct-input import and history
        run: python3 e2e/frigate_direct_auth.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-auth-import-${{ matrix.frigate }}
          path: e2e-artifacts/frigate-direct-auth/
          if-no-files-found: error
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-direct-auth-${{ matrix.frigate }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  frigate-audio:
    name: Frigate audio policy / ${{ matrix.frigate }}
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        frigate: ["0.17.2", "0.18.2"]
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: ghcr.io/reefyai/camadmiral-ci@sha256:b594314f18c7417ab93a25f58dcdf5a63c302ab63eedd8210beb4d0312453b67
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
      FRIGATE_TEST_VERSION: ${{ matrix.frigate }}
    timeout-minutes: 20
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify prepared CI inputs
        run: python3 scripts/ci_tools.py
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - name: Verify baseline and video-only policy with real A/V
        run: python3 e2e/frigate_audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frigate-audio-${{ matrix.frigate }}
          path: e2e-artifacts/frigate-audio/
          if-no-files-found: error
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-frigate-audio-${{ matrix.frigate }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  frigate-identity:
    name: Imported camera address recovery
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e == 'true'
    concurrency:
      group: camadmiral-frigate-identity
      cancel-in-progress: false
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: ghcr.io/reefyai/camadmiral-ci@sha256:b594314f18c7417ab93a25f58dcdf5a63c302ab63eedd8210beb4d0312453b67
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 25
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Verify prepared CI inputs
        run: python3 scripts/ci_tools.py
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install browser dependencies
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install webkit
      - name: Verify imported physical identity and DHCP recovery
        run: python3 e2e/frigate_identity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frigate-identity-evidence
          path: e2e-artifacts/frigate-identity/
          if-no-files-found: ignore
      - name: Remove identity regression resources
        if: always()
        env:
          IDENTITY_TEST_IMAGE: camadmiral-frigate-identity:cleanup
        run: >-
          docker compose -p camadmiral-frigate-identity
          -f e2e/frigate-identity-compose.yaml down --volumes --remove-orphans
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  stalled-snapshot:
    name: Stalled snapshot cleanup
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e == 'true'
    uses: ./.github/workflows/stalled-snapshot.yml
    with:
      github_hosted: ${{ inputs.github_hosted || false }}

  passive-rtsp:
    name: Receive-only RTSP compatibility
    concurrency:
      group: camadmiral-passive-rtsp
      cancel-in-progress: false
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e == 'true'
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: ghcr.io/reefyai/camadmiral-ci@sha256:b594314f18c7417ab93a25f58dcdf5a63c302ab63eedd8210beb4d0312453b67
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 20
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify prepared CI inputs
        run: python3 scripts/ci_tools.py
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - name: Verify baseline failure and fixed video with microphone audio
        run: python3 e2e/passive_rtsp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passive-rtsp-evidence
          path: e2e-artifacts/passive-rtsp/
      - name: Remove passive RTSP regression resources
        if: always()
        run: >-
          docker compose -p camadmiral-passive-e2e
          -f e2e/compose.yaml -f e2e/passive-rtsp-compose.yaml
          down --volumes --remove-orphans
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  memory-regression:
    name: Production memory envelope
    concurrency:
      group: camadmiral-memory-regression
      cancel-in-progress: false
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e == 'true'
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: ghcr.io/reefyai/camadmiral-ci@sha256:b594314f18c7417ab93a25f58dcdf5a63c302ab63eedd8210beb4d0312453b67
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 15
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Verify prepared CI inputs
        run: python3 scripts/ci_tools.py
      - name: Start private Docker lab
        uses: ./.github/actions/docker-lab
      - name: Verify concurrent media workload without OOM or retained-memory growth
        run: python3 e2e/memory_pressure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-memory-release-evidence
          path: e2e-artifacts/memory-pressure/
      - name: Remove memory regression resources
        if: always()
        run: >-
          docker compose -p camadmiral-memory-e2e
          -f e2e/compose.yaml -f e2e/memory-compose.yaml
          down --volumes --remove-orphans
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  classify-changes:
    name: Classify changes
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4

      - name: Test release-gate classification
        uses: actions/github-script@v7
        with:
          script: |
            const { runClassifierTests } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-gate-classifier.test.cjs`
            );
            runClassifierTests();
            core.info("Release-gate classifier tests passed.");

      - name: Decide whether runtime validation is required
        id: classify
        uses: actions/github-script@v7
        env:
          FORCE_FULL: ${{ inputs.force_full }}
          BATCH_ONLY: ${{ inputs.batch_only }}
        with:
          script: |
            if (context.eventName === "workflow_dispatch" && process.env.BATCH_ONLY === "true") {
              core.setOutput("runtime", "false");
              core.setOutput("e2e", "false");
              core.info("Focused parallel regression run; this cannot satisfy the release publisher's isolated-UI requirement.");
              return;
            }
            if (process.env.FORCE_FULL === "true" || context.eventName !== "pull_request") {
              core.setOutput("runtime", "true");
              core.setOutput("e2e", "true");
              return;
            }

            const { classifyReleaseGate } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-gate-classifier.cjs`
            );
            const files = [];
            let complete = false;
            for (let page = 1; page <= 30; page += 1) {
              const response = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
                page,
              });
              const pageFiles = response.data || [];
              files.push(...pageFiles);
              if (pageFiles.length < 100) {
                complete = true;
                break;
              }
            }
            const decision = classifyReleaseGate(files, complete);
            core.setOutput("runtime", decision.runtime ? "true" : "false");
            core.setOutput("e2e", decision.e2e ? "true" : "false");
            core.info(decision.reason);

  recording-continuity:
    name: Recording continuity
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e == 'true'
    # Never execute code from a fork on Reefy's persistent infrastructure.
    # Trusted branches use the general runner pool, retaining Docker and browser
    # caches between release-gate runs.
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: ghcr.io/reefyai/camadmiral-ci@sha256:b594314f18c7417ab93a25f58dcdf5a63c302ab63eedd8210beb4d0312453b67
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 60
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Verify prepared CI inputs
        run: python3 scripts/ci_tools.py
      - name: Start private Docker lab
        if: needs.classify-changes.outputs.e2e == 'true'
        uses: ./.github/actions/docker-lab

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate Reefy app version
        run: python3 scripts/validate-release.py

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r e2e/requirements.txt

      - name: Verify recording continuity after camera removal
        if: needs.classify-changes.outputs.e2e == 'true'
        run: python3 e2e/recording_continuity.py

      - name: Upload recording continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-continuity-evidence
          path: e2e-artifacts/recording-continuity/
          if-no-files-found: error
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always() && needs.classify-changes.outputs.e2e == 'true'
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  frigate-import:
    name: Frigate import and history
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e == 'true'
    # Never execute code from a fork on Reefy's persistent infrastructure.
    # Trusted branches use the general runner pool, retaining Docker and browser
    # caches between release-gate runs.
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: ghcr.io/reefyai/camadmiral-ci@sha256:b594314f18c7417ab93a25f58dcdf5a63c302ab63eedd8210beb4d0312453b67
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 60
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Verify prepared CI inputs
        run: python3 scripts/ci_tools.py
      - name: Start private Docker lab
        if: needs.classify-changes.outputs.e2e == 'true'
        uses: ./.github/actions/docker-lab

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate Reefy app version
        run: python3 scripts/validate-release.py

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r e2e/requirements.txt

      - name: Install browser for UI E2E
        if: needs.classify-changes.outputs.e2e == 'true'
        run: python -m playwright install webkit

      - name: Verify Frigate import and camera history preservation
        if: needs.classify-changes.outputs.e2e == 'true'
        run: python3 e2e/frigate_import.py

      - name: Upload Frigate import evidence
        if: always() && needs.classify-changes.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frigate-import-evidence
          path: e2e-artifacts/frigate-import/
          if-no-files-found: ignore

      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always() && needs.classify-changes.outputs.e2e == 'true'
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore

  release-gate:
    name: Unit, component, and E2E
    needs: classify-changes
    if: needs.classify-changes.outputs.runtime == 'true'
    # Never execute code from a fork on Reefy's persistent infrastructure.
    # Trusted branches use the general runner pool, retaining Docker and browser
    # caches between release-gate runs.
    runs-on: ${{ fromJSON((inputs.github_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    container:
      image: ghcr.io/reefyai/camadmiral-ci@sha256:b594314f18c7417ab93a25f58dcdf5a63c302ab63eedd8210beb4d0312453b67
      options: --privileged --cgroupns=private
      volumes:
        - /var/lib/camadmiral-ci-docker
    env:
      CAMADMIRAL_CI_JOB_CONTAINER: "1"
      AGENT_TOOLSDIRECTORY: /opt/camadmiral-toolcache
      PIP_CACHE_DIR: /opt/camadmiral-pipcache
    timeout-minutes: 60
    steps:
      - name: Bootstrap job container
        shell: bash
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Verify prepared CI inputs
        run: python3 scripts/ci_tools.py
      - name: Start private Docker lab
        if: needs.classify-changes.outputs.e2e == 'true'
        uses: ./.github/actions/docker-lab

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate Reefy app version
        run: python3 scripts/validate-release.py

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r e2e/requirements.txt

      - name: Run unit and component tests
        run: python -m unittest discover -s tests -v

      - name: Install browser for UI E2E
        if: needs.classify-changes.outputs.e2e == 'true'
        run: python -m playwright install webkit

      - name: Run isolated E2E lab
        if: needs.classify-changes.outputs.e2e == 'true'
        run: python3 e2e/run.py

      - name: Upload UI E2E failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: camadmiral-ui-e2e-failure
          path: e2e-artifacts/
          if-no-files-found: ignore

      - name: Remove E2E resources
        if: always() && needs.classify-changes.outputs.e2e == 'true'
        run: >-
          docker compose --project-name camadmiral-e2e --file e2e/compose.yaml
          --profile moved --profile rotated --profile identity down --volumes --remove-orphans
      - name: Retain Docker lab readiness
        uses: actions/upload-artifact@v4
        if: always() && needs.classify-changes.outputs.e2e == 'true'
        with:
          name: docker-lab-${{ github.job }}
          path: e2e-artifacts/docker-lab/
          if-no-files-found: ignore
