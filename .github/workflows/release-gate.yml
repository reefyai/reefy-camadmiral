name: CamAdmiral release gate

on:
  workflow_call:
    inputs:
      force_full:
        description: Run the complete release gate regardless of changed paths
        type: boolean
        default: true
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: Run the complete release gate regardless of changed paths
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: camadmiral-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - name: Decide whether runtime validation is required
        id: classify
        uses: actions/github-script@v7
        env:
          FORCE_FULL: ${{ inputs.force_full }}
        with:
          script: |
            if (process.env.FORCE_FULL === "true" || context.eventName !== "pull_request") {
              core.setOutput("runtime", "true");
              core.setOutput("e2e", "true");
              return;
            }

            const files = [];
            let complete = false;
            for (let page = 1; page <= 30; page += 1) {
              const response = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha,
                per_page: 100,
                page,
              });
              const pageFiles = response.data.files || [];
              files.push(...pageFiles);
              if (pageFiles.length < 100) {
                complete = true;
                break;
              }
            }
            const documentationPath = path => path === "README.md" || path.startsWith("docs/");
            const documentationOnly = files.length > 0 && complete && files.every(file =>
              documentationPath(file.filename) &&
              (!file.previous_filename || documentationPath(file.previous_filename))
            );
            if (documentationOnly) {
              core.setOutput("runtime", "false");
              core.setOutput("e2e", "false");
              core.info("Documentation-only commit: skipping runtime validation.");
              return;
            }

            const releaseCandidate = complete && files.some(file =>
              file.filename === "VERSION" || file.previous_filename === "VERSION"
            );
            core.setOutput("runtime", "true");
            core.setOutput("e2e", releaseCandidate || !complete ? "true" : "false");
            core.info(releaseCandidate
              ? "Versioned release-candidate commit: running the complete E2E gate."
              : complete
                ? "Development commit: running fast validation only."
                : "Large or incomplete commit: running the complete E2E gate.");

  release-gate:
    name: Unit, component, and E2E
    needs: classify-changes
    if: needs.classify-changes.outputs.runtime == 'true'
    # Never execute code from a fork on Reefy's persistent infrastructure.
    # Trusted branches use the large runner so Docker and browser caches are
    # retained between release-gate runs.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird","large"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate Reefy app version
        run: python3 scripts/validate-release.py

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r e2e/requirements.txt

      - name: Install browser for UI E2E
        if: needs.classify-changes.outputs.e2e == 'true'
        run: python -m playwright install --with-deps webkit

      - name: Run unit and component tests
        run: python -m unittest discover -s tests -v

      - name: Run isolated E2E lab
        if: needs.classify-changes.outputs.e2e == 'true'
        run: python3 e2e/run.py

      - name: Upload UI E2E failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: camadmiral-ui-e2e-failure
          path: e2e-artifacts/
          if-no-files-found: ignore

      - name: Remove E2E resources
        if: always() && needs.classify-changes.outputs.e2e == 'true'
        run: >-
          docker compose --project-name camadmiral-e2e --file e2e/compose.yaml
          --profile moved --profile rotated down --volumes --remove-orphans
