<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CamAdmiral solution architecture</title>
  <desc id="desc">LAN cameras connect to CamAdmiral, which discovers, adopts, validates, and shares their streams with Frigate and other consumers. CamAdmiral sends offline and recovery alerts to an administrator through Telegram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b26"/>
      <stop offset="1" stop-color="#06111c"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3441"/>
      <stop offset="1" stop-color="#0a2633"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23d8c5"/>
      <stop offset="1" stop-color="#4aead2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000913" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41dac8"/>
    </marker>
    <style>
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f8fb; }
      .subtitle { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #91a8b9; }
      .column-title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f1f7fa; }
      .card-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ecf7fa; }
      .body { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a8bdca; }
      .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7f9aaa; letter-spacing: 0.04em; }
      .core-title { font: 750 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7fbfc; }
      .core-label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #76f0da; }
      .core-body { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b6cbd5; }
      .flow-label { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8ff5e4; letter-spacing: 0.04em; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#background)"/>
  <circle cx="860" cy="355" r="390" fill="#0b3e49" opacity="0.12"/>
  <circle cx="215" cy="515" r="245" fill="#0a8890" opacity="0.06"/>

  <text x="64" y="66" class="title">CamAdmiral solution</text>
  <text x="64" y="98" class="subtitle">One control point between cameras on the LAN and every downstream consumer</text>

  <!-- LAN cameras -->
  <g filter="url(#shadow)">
    <rect x="54" y="160" width="350" height="522" rx="26" fill="#0a1c2b" stroke="#234154" stroke-width="2"/>
  </g>
  <g transform="translate(84 194)">
    <rect x="0" y="0" width="42" height="34" rx="8" fill="#103846" stroke="#2acfc0"/>
    <circle cx="21" cy="17" r="9" fill="none" stroke="#7cf5e0" stroke-width="3"/>
    <path d="M12 35h18M17 35l-5 9M25 35l5 9" stroke="#7cf5e0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="142" y="221" class="column-title">Cameras on the LAN</text>
  <text x="84" y="262" class="body">Automatically found and tracked</text>

  <g transform="translate(80 292)">
    <rect width="298" height="100" rx="18" fill="#0b2434" stroke="#1f4052"/>
    <circle cx="42" cy="50" r="23" fill="#103947"/>
    <circle cx="42" cy="50" r="10" fill="none" stroke="#56e3cf" stroke-width="3"/>
    <text x="80" y="42" class="card-title">ONVIF cameras</text>
    <text x="80" y="68" class="body">Discovery, profiles, metadata</text>
  </g>
  <g transform="translate(80 408)">
    <rect width="298" height="100" rx="18" fill="#0b2434" stroke="#1f4052"/>
    <circle cx="42" cy="50" r="23" fill="#103947"/>
    <path d="M29 57c8-18 18-18 26 0M32 47c6-10 14-10 20 0M38 39c3-3 5-3 8 0" fill="none" stroke="#56e3cf" stroke-width="3" stroke-linecap="round"/>
    <text x="80" y="42" class="card-title">RTSP-only cameras</text>
    <text x="80" y="68" class="body">Known paths plus validation</text>
  </g>
  <g transform="translate(80 524)">
    <rect width="298" height="118" rx="18" fill="#0b2434" stroke="#1f4052"/>
    <circle cx="42" cy="52" r="23" fill="#103947"/>
    <path d="M31 54a12 12 0 1 0 4-12M31 42v12h12" fill="none" stroke="#56e3cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="42" class="card-title">Changing IP addresses</text>
    <text x="80" y="68" class="body">MAC and ONVIF identity</text>
    <text x="80" y="91" class="body">keep adopted cameras stable</text>
  </g>

  <!-- CamAdmiral core -->
  <g filter="url(#shadow)">
    <rect x="520" y="142" width="560" height="576" rx="30" fill="url(#core)" stroke="#2fd8c8" stroke-width="2"/>
  </g>
  <g transform="translate(558 180)">
    <rect width="62" height="62" rx="16" fill="#f7fbfc"/>
    <path d="M13 29h36v22H13z" fill="#073247"/>
    <circle cx="31" cy="40" r="9" fill="none" stroke="#57e7d3" stroke-width="4"/>
    <path d="M15 24c7-10 25-13 34-3l-3 5H18zM22 16c8-6 17-6 25 0" fill="#073247" stroke="#073247" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="640" y="208" class="core-title">CamAdmiral</text>
  <text x="640" y="238" class="body">Discovery, media, health, and integrations</text>

  <g transform="translate(554 278)">
    <rect width="238" height="166" rx="20" fill="#092331" stroke="#256071"/>
    <circle cx="28" cy="30" r="6" fill="#26d9b9"/>
    <text x="46" y="36" class="core-label">Discover</text>
    <text x="24" y="72" class="core-body">ONVIF and RTSP scanning</text>
    <text x="24" y="99" class="core-body">Embedded URL-path catalog</text>
    <text x="24" y="126" class="core-body">IP change recovery</text>
  </g>
  <g transform="translate(808 278)">
    <rect width="238" height="166" rx="20" fill="#092331" stroke="#256071"/>
    <circle cx="28" cy="30" r="6" fill="#26d9b9"/>
    <text x="46" y="36" class="core-label">Adopt</text>
    <text x="24" y="72" class="core-body">Validate credentials</text>
    <text x="24" y="99" class="core-body">Inspect every stream</text>
    <text x="24" y="126" class="core-body">Encrypt camera secrets</text>
  </g>
  <g transform="translate(554 462)">
    <rect width="238" height="190" rx="20" fill="#092331" stroke="#256071"/>
    <circle cx="28" cy="30" r="6" fill="#26d9b9"/>
    <text x="46" y="36" class="core-label">Manage media</text>
    <text x="24" y="72" class="core-body">Shared go2rtc upstream</text>
    <text x="24" y="99" class="core-body">Stable downstream URLs</text>
    <text x="24" y="126" class="core-body">Live view and thumbnails</text>
    <text x="24" y="153" class="core-body">Record and detect roles</text>
  </g>
  <g transform="translate(808 462)">
    <rect width="238" height="190" rx="20" fill="#092331" stroke="#256071"/>
    <circle cx="28" cy="30" r="6" fill="#26d9b9"/>
    <text x="46" y="36" class="core-label">Operate</text>
    <text x="24" y="72" class="core-body">Health and availability</text>
    <text x="24" y="99" class="core-body">Camera metadata API</text>
    <text x="24" y="126" class="core-body">Frigate synchronization</text>
    <text x="24" y="153" class="core-body">Enable and disable control</text>
  </g>

  <!-- Consumers -->
  <g filter="url(#shadow)">
    <rect x="1196" y="160" width="350" height="522" rx="26" fill="#0a1c2b" stroke="#234154" stroke-width="2"/>
  </g>
  <g transform="translate(1226 193)">
    <path d="M4 7h38v32H4zM10 13h26v20H10z" fill="#103846" stroke="#56e3cf" stroke-width="2"/>
    <path d="M18 43h10M23 39v4" stroke="#56e3cf" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1284" y="221" class="column-title">Downstream consumers</text>
  <text x="1226" y="262" class="body">Stable streams and camera metadata</text>

  <g transform="translate(1222 292)">
    <rect width="298" height="100" rx="18" fill="#0b2434" stroke="#1f4052"/>
    <rect x="19" y="25" width="46" height="46" rx="13" fill="#103947"/>
    <text x="42" y="57" text-anchor="middle" class="card-title">F</text>
    <text x="82" y="42" class="card-title">Frigate</text>
    <text x="82" y="68" class="body">Managed record and detect</text>
  </g>
  <g transform="translate(1222 408)">
    <rect width="298" height="100" rx="18" fill="#0b2434" stroke="#1f4052"/>
    <rect x="19" y="25" width="46" height="46" rx="13" fill="#103947"/>
    <path d="M30 36h9v9h-9zM45 36h9v9h-9zM30 51h9v9h-9zM45 51h9v9h-9z" fill="#56e3cf"/>
    <text x="82" y="42" class="card-title">Reefy apps</text>
    <text x="82" y="68" class="body">Camera catalog and metadata</text>
  </g>
  <g transform="translate(1222 524)">
    <rect width="298" height="118" rx="18" fill="#0b2434" stroke="#1f4052"/>
    <rect x="19" y="33" width="46" height="46" rx="13" fill="#103947"/>
    <path d="M29 56h5l4-10 6 21 5-12h7" fill="none" stroke="#56e3cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="42" class="card-title">NVR and AI tools</text>
    <text x="82" y="68" class="body">RTSP players, analytics,</text>
    <text x="82" y="91" class="body">and custom integrations</text>
  </g>

  <!-- Main data flows -->
  <path d="M404 410H500" fill="none" stroke="#41dac8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="404" y="365" width="116" height="28" rx="14" fill="#0b2a37"/>
  <text x="462" y="384" text-anchor="middle" class="flow-label">ONVIF + RTSP</text>

  <path d="M1080 410H1176" fill="none" stroke="#41dac8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1071" y="352" width="126" height="44" rx="14" fill="#0b2a37"/>
  <text x="1134" y="370" text-anchor="middle" class="flow-label">STABLE RTSP</text>
  <text x="1134" y="387" text-anchor="middle" class="small">API + metadata</text>

  <!-- Telegram alert path -->
  <path d="M800 718V756" fill="none" stroke="#41dac8" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="520" y="772" width="312" height="92" rx="22" fill="#0a2736" stroke="#2a7d82" stroke-width="2"/>
  </g>
  <circle cx="566" cy="818" r="25" fill="#29a9df"/>
  <path d="M553 817l27-11-7 29-8-9-7 6 2-11z" fill="#f6fbfd"/>
  <text x="608" y="810" class="card-title">Telegram alerts</text>
  <text x="608" y="836" class="body">Offline and recovered</text>

  <path d="M832 818H882" fill="none" stroke="#41dac8" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="900" y="772" width="260" height="92" rx="22" fill="#0a2736" stroke="#2a7d82" stroke-width="2"/>
  </g>
  <circle cx="946" cy="813" r="15" fill="#56e3cf"/>
  <path d="M921 846c4-16 14-24 25-24s21 8 25 24" fill="none" stroke="#56e3cf" stroke-width="4" stroke-linecap="round"/>
  <text x="990" y="810" class="card-title">Administrator</text>
  <text x="990" y="836" class="body">Immediate awareness</text>
</svg>
