name: camadmiral-e2e

services:
  camadmiral:
    build:
      context: ..
      args:
        CHECKPOINT_REVISION: e2e
    image: camadmiral-e2e:local
    entrypoint: ["/bin/sh", "/e2e/start-camadmiral.sh"]
    environment:
      CAMADMIRAL_HEALTH_INTERVAL: "10"
      CAMADMIRAL_RECOVERY_RETRY_INTERVAL: "60"
      CAMADMIRAL_RUNTIME_RECONCILE_INTERVAL: "2"
    volumes:
      - camadmiral-data:/var/lib/camadmiral
      - ./fixtures:/e2e/fixtures:ro
      - ./faults.py:/e2e/faults.py:ro
      - ./start-camadmiral.sh:/e2e/start-camadmiral.sh:ro
      - ./fixtures/api-token:/run/secrets/camadmiral_api_token:ro
      - ./fixtures/admin-password:/run/secrets/camadmiral_admin_password:ro
      - ./fixtures/camadmiral.yaml:/etc/camadmiral/config.yaml:ro
    ports:
      - "127.0.0.1::18080"
    pids_limit: 192
    networks:
      lab:
        ipv4_address: 172.30.0.20
        gw_priority: 1
      secondary:
        ipv4_address: 172.31.0.20
        gw_priority: 0
      large:
        ipv4_address: 172.29.0.20
        gw_priority: 0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run/camadmiral:rw,noexec,nosuid,size=4m,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["test -f /config/config.yml || cp /e2e/frigate.yml /config/config.yml; exec /init"]
    networks:
      lab:
        ipv4_address: 172.30.0.30
    shm_size: 128mb
    volumes:
      - frigate-config:/config
      - frigate-media:/media/frigate
      - ./fixtures/frigate.yml:/e2e/frigate.yml:ro
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp/cache:size=128m
    healthcheck:
      disable: true

  frigate-api-proxy:
    image: camadmiral-e2e:local
    entrypoint: ["python", "/e2e/tcp_proxy.py"]
    network_mode: service:camadmiral
    depends_on: [camadmiral, frigate]
    volumes:
      - ./tcp_proxy.py:/e2e/tcp_proxy.py:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      disable: true

  camera-open:
    image: camadmiral-e2e:local
    entrypoint: ["/usr/local/bin/go2rtc", "-config", "/e2e/camera-open.yaml"]
    volumes:
      - ./fixtures/camera-open.yaml:/e2e/camera-open.yaml:ro
    networks:
      lab:
        ipv4_address: 172.30.0.10
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      disable: true

  latency-relay:
    image: camadmiral-e2e:local
    entrypoint: ["/usr/local/bin/go2rtc", "-config", "/e2e/latency-relay.yaml"]
    volumes:
      - ./fixtures/latency-relay.yaml:/e2e/latency-relay.yaml:ro
    networks:
      lab:
        ipv4_address: 172.30.0.14
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      disable: true

  camera-open-moved:
    image: camadmiral-e2e:local
    entrypoint: ["/usr/local/bin/go2rtc", "-config", "/e2e/camera-open.yaml"]
    volumes:
      - ./fixtures/camera-open.yaml:/e2e/camera-open.yaml:ro
    networks:
      lab:
        ipv4_address: 172.30.0.12
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      disable: true
    profiles: [moved]

  camera-auth:
    image: camadmiral-e2e:local
    entrypoint: ["/usr/local/bin/go2rtc", "-config", "/e2e/camera-auth.yaml"]
    volumes:
      - ./fixtures/camera-auth.yaml:/e2e/camera-auth.yaml:ro
    networks:
      lab:
        ipv4_address: 172.30.0.11
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      disable: true

  camera-onvif:
    image: camadmiral-e2e:local
    entrypoint: ["python", "/e2e/fake_onvif.py"]
    volumes:
      - ./fake_onvif.py:/e2e/fake_onvif.py:ro
      - ./fixtures/camera-onvif.yaml:/e2e/camera-onvif.yaml:ro
    networks:
      lab:
        ipv4_address: 172.30.0.13
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      disable: true

  camera-onvif-large:
    image: camadmiral-e2e:local
    entrypoint: ["python", "/e2e/fake_onvif.py"]
    environment:
      ONVIF_ADDRESS: 172.29.0.87
      ONVIF_UUID: synthetic-onvif-large
      ONVIF_NAME: Large Subnet ONVIF
    volumes:
      - ./fake_onvif.py:/e2e/fake_onvif.py:ro
      - ./fixtures/camera-onvif.yaml:/e2e/camera-onvif.yaml:ro
    networks:
      large:
        ipv4_address: 172.29.0.87
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      disable: true

  camera-rtsp-large:
    image: camadmiral-e2e:local
    entrypoint: ["/usr/local/bin/go2rtc", "-config", "/e2e/camera-secondary.yaml"]
    volumes:
      - ./fixtures/camera-secondary.yaml:/e2e/camera-secondary.yaml:ro
    networks:
      large:
        ipv4_address: 172.29.0.88
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      disable: true

  camera-secondary:
    image: camadmiral-e2e:local
    entrypoint: ["/usr/local/bin/go2rtc", "-config", "/e2e/camera-secondary.yaml"]
    volumes:
      - ./fixtures/camera-secondary.yaml:/e2e/camera-secondary.yaml:ro
    networks:
      secondary:
        ipv4_address: 172.31.0.87
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      disable: true

  camera-auth-rotated:
    image: camadmiral-e2e:local
    entrypoint: ["/usr/local/bin/go2rtc", "-config", "/e2e/camera-auth-rotated.yaml"]
    volumes:
      - ./fixtures/camera-auth-rotated.yaml:/e2e/camera-auth-rotated.yaml:ro
    networks:
      lab:
        ipv4_address: 172.30.0.11
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      disable: true
    profiles: [rotated]

  test-driver:
    image: camadmiral-e2e:local
    entrypoint: ["python", "/e2e/scenarios.py"]
    user: "0:0"
    volumes:
      - .:/e2e:ro
      - e2e-state:/state
    networks: [lab, secondary, large]
    environment:
      CAMADMIRAL_E2E_ADMIN_PASSWORD: synthetic-e2e-admin-password
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  secondary:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  large:
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  camadmiral-data:
  e2e-state:
  frigate-config:
  frigate-media:
