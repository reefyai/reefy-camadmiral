services:
  import-api-proxy:
    image: camadmiral-e2e:local
    entrypoint: [python, /e2e/frigate_restart_proxy.py]
    network_mode: service:camadmiral
    depends_on: [camadmiral, frigate]
    volumes:
      - ./frigate_restart_proxy.py:/e2e/frigate_restart_proxy.py:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    healthcheck:
      disable: true
  frigate:
    volumes:
      - ./fixtures/frigate-import.yml:/e2e/frigate.yml:ro
  camera-auth:
    volumes:
      - ./fixtures/camera-auth-import.yaml:/e2e/camera-auth.yaml:ro
  import-stalled:
    image: camadmiral-e2e:local
    entrypoint: [python, /e2e/stalled_rtsp_proxy.py]
    volumes:
      - ./stalled_rtsp_proxy.py:/e2e/stalled_rtsp_proxy.py:ro
    networks:
      lab:
        ipv4_address: 172.30.0.41
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
  import-limited:
    image: camadmiral-e2e:local
    entrypoint: [python, /e2e/stalled_rtsp_proxy.py]
    environment:
      RTSP_SESSION_LIMIT: "1"
    volumes:
      - ./stalled_rtsp_proxy.py:/e2e/stalled_rtsp_proxy.py:ro
    networks:
      lab:
        ipv4_address: 172.30.0.43
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
  import-external:
    image: camadmiral-e2e:local
    entrypoint: [python, /e2e/stalled_rtsp_proxy.py]
    environment:
      RTSP_SESSION_LIMIT: "1"
    volumes:
      - ./stalled_rtsp_proxy.py:/e2e/stalled_rtsp_proxy.py:ro
    networks:
      lab:
        ipv4_address: 172.30.0.44
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
  external-recorder:
    image: camadmiral-e2e:local
    entrypoint: [python, /e2e/identity_consumer.py]
    user: "0:0"
    environment:
      IDENTITY_CONFIG_PATH: /e2e/external-reader.json
      IDENTITY_STATUS_PATH: /state/external-reader-status.json
      IDENTITY_TELEMETRY_PATH: /state/external-reader-frames.jsonl
      IDENTITY_USER_AGENT_PREFIX: CamAdmiral-E2E-External
    volumes:
      - ./identity_consumer.py:/e2e/identity_consumer.py:ro
      - ./frame_fingerprint.py:/e2e/frame_fingerprint.py:ro
      - ./fixtures/import-external-reader.json:/e2e/external-reader.json:ro
      - e2e-state:/state
    networks: [lab]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    healthcheck:
      disable: true
  camera-auth-import-moved:
    image: camadmiral-e2e:local
    entrypoint: [/usr/local/bin/go2rtc, -config, /e2e/camera-auth.yaml]
    volumes:
      - ./fixtures/camera-auth-import-moved.yaml:/e2e/camera-auth.yaml:ro
    networks:
      lab:
        ipv4_address: 172.30.0.42
        aliases: [camera-auth]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    healthcheck:
      disable: true
