services:
  # Keep fault state and network reachability independent of the process under
  # interruption. Sharing its network namespace invalidates localhost on restart.
  import-api-proxy:
    network_mode: !reset null
    networks:
      lab:
        ipv4_address: 172.30.0.47
  frigate:
    image: ${FRIGATE_TEST_IMAGE:-ghcr.io/blakeblackshear/frigate:0.18.2}
    volumes:
      - ./fixtures/frigate-restart-recovery.yml:/e2e/frigate.yml:ro
  import-failure:
    extends:
      file: frigate-import-compose.yaml
      service: import-limited
    networks:
      lab:
        ipv4_address: 172.30.0.45
  import-interrupted:
    extends:
      file: frigate-import-compose.yaml
      service: import-limited
    networks:
      lab:
        ipv4_address: 172.30.0.46
